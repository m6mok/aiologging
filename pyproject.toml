[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiologging"
version = "0.2.11"
description = "Asynchronous logging library mirroring the standard logging API, with durable shared journaling"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Evgenii Dementev (m6mok)"}
]
keywords = ["logging", "async", "asyncio", "aiologging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
requires-python = ">=3.11,<3.16"
dependencies = []

[project.optional-dependencies]
aiofiles = [
    "aiofiles>=23.0.0",
]
aiohttp = [
    "aiohttp>=3.8.0",
]
httpx = [
    "httpx>=0.24.0",
]
all = [
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "black>=26.0.0",
    "types-aiofiles",
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/m6mok/aiologging"
Repository = "https://github.com/m6mok/aiologging"
"Bug Tracker" = "https://github.com/m6mok/aiologging/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiologging*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# anyio/httpcore (httpx dependencies) use syntax newer than the
# python_version above; do not follow imports into them
[[tool.mypy.overrides]]
module = ["anyio.*", "httpcore.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=aiologging",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["aiologging"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 79
target-version = ["py311"]
